<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05050f" />
    <title>Fruit Voyage</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍊</text></svg>" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>
    <div id="flash" aria-hidden="true"></div>

    <nav id="progress" aria-label="Journey progress"></nav>

    <section id="card" class="card is-hidden" aria-live="polite">
      <p class="card__kicker"></p>
      <h1 class="card__title"></h1>
      <p class="card__text"></p>
      <button class="card__btn" type="button"></button>
    </section>

    <div id="fallback" hidden>
      <p>This page needs WebGL to fly you through space. Try a different browser or device.</p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
