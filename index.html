<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>BDAY!!!</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎉</text></svg>" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>

    <section id="card" class="card is-hidden" aria-live="polite">
      <!-- Shown on the objects themselves; kept here for screen readers only. -->
      <h1 class="card__title sr-only"></h1>
      <p class="card__text sr-only"></p>
      <button class="card__btn" type="button" disabled></button>
    </section>

    <!-- Theatre curtains covering everything until the note is clicked. -->
    <div id="stage" class="stage">
      <div class="stage__half stage__half--left"></div>
      <div class="stage__half stage__half--right"></div>
      <div class="stage__valance"><div class="stage__swag"></div></div>
      <button class="stage__note" type="button">Paspausk jei nori paziureti kas cia:D</button>
    </div>

    <div id="fallback" hidden>
      <p>This page needs WebGL to fly you between the fruits. Try a different browser or device.</p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
